<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 520px; margin: 6vh auto; padding: 0 20px; }
  h1 { font-size: 1.3rem; margin-bottom: 2px; }
  .meta { opacity: .7; font-size: .9rem; margin-bottom: 4px; }
  .seats { font-size: .85rem; opacity: .8; margin-bottom: 18px; }
  label { display: block; margin: 12px 0 4px; font-size: .9rem; }
  input { width: 100%; padding: 9px 11px; border: 1px solid #8886; border-radius: 8px; font: inherit; background: transparent; color: inherit; box-sizing: border-box; }
  button { margin-top: 18px; padding: 10px 18px; border: 0; border-radius: 8px; background: #111; color: #fff; font: inherit; cursor: pointer; }
  @media (prefers-color-scheme: dark) { button { background: #eee; color: #111; } }
  #msg { margin-top: 18px; padding: 12px 14px; border-radius: 8px; font-size: .92rem; display: none; }
  #msg.ok { background: #10b98122; display: block; }
  #msg.err { background: #ef444422; display: block; }
  a { color: inherit; }
</style>
</head>
<body>
<h1 id="ename">Register</h1>
<div class="meta" id="edetail"></div>
<div class="seats" id="eseats"></div>

<form id="form">
  <label>Full name</label>
  <input id="name" required autocomplete="name">
  <label>Email</label>
  <input id="email" type="email" required autocomplete="email">
  <label>Phone (optional)</label>
  <input id="phone" type="tel" autocomplete="tel">
  <button type="submit">Register</button>
</form>
<div id="msg"></div>

<script>
const slug = new URLSearchParams(location.search).get('event');
const msg = document.getElementById('msg');

async function loadEvent() {
  if (!slug) { fail('No event specified.'); return; }
  try {
    const r = await fetch('/api/events/' + encodeURIComponent(slug));
    if (!r.ok) { fail('Event not found.'); return; }
    const e = await r.json();
    document.getElementById('ename').textContent = e.name;
    document.getElementById('edetail').textContent =
      [e.starts_at ? new Date(e.starts_at).toLocaleString() : null, e.location].filter(Boolean).join(' · ');
    document.getElementById('eseats').textContent =
      e.full ? 'This event is full.' : (e.seats_remaining + ' seats left');
  } catch (err) { fail('Could not load the event.'); }
}

document.getElementById('form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  msg.className = ''; msg.style.display = 'none';
  const body = {
    name: name.value.trim(),
    email: email.value.trim(),
    phone: phone.value.trim(),
    source: 'web'
  };
  try {
    const r = await fetch('/api/events/' + encodeURIComponent(slug) + '/registrations', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await r.json();
    if (r.ok) {
      ok(data.message || 'You are registered. See you there.');
      document.getElementById('form').reset();
    } else {
      fail(data.error || 'Registration failed.');
    }
  } catch (err) { fail('Something went wrong. Try again.'); }
});

function ok(t){ msg.textContent = t; msg.className = 'ok'; }
function fail(t){ msg.textContent = t; msg.className = 'err'; }
loadEvent();
</script>
</body>
</html>
